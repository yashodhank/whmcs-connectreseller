name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    name: PHPUnit PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '7.4'
            setup: '7.4'
          - php: '8.1'
            setup: '8.1'
          - php: '8.2'
            setup: '8.2.35'
            floor: '8.2.35'
          - php: '8.3'
            setup: '8.3.36'
            floor: '8.3.36'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          # 8.2/8.3 are exact patches. Do not fall back to floating 8.2 or 8.3.
          php-version: ${{ matrix.setup }}
          extensions: curl, json, mbstring
          coverage: none
          tools: composer:v2
      - name: Assert patched PHP
        if: ${{ matrix.floor }}
        env:
          PHP_FLOOR: ${{ matrix.floor }}
        run: php -r 'fwrite(STDERR, "PHP_VERSION=" . PHP_VERSION . " floor=" . getenv("PHP_FLOOR") . PHP_EOL); exit(version_compare(PHP_VERSION, getenv("PHP_FLOOR"), ">=") ? 0 : 1);'
      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ matrix.setup }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-${{ matrix.setup }}-
            ${{ runner.os }}-composer-
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction
      - name: PHPUnit
        run: vendor/bin/phpunit

  publish:
    name: GitHub Release zip
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build distribution zip
        env:
          VERSION: ${{ github.ref_name }}
        run: bash scripts/build-release.sh
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.sha256
          body_path: dist/notes.md
          fail_on_unmatched_files: true
