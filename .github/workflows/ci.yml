name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  static:
    name: Static (PHP 8.2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, json, mbstring
          coverage: none
          tools: composer:v2
      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-8.2-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-8.2-
            ${{ runner.os }}-composer-
      - name: Validate composer.json
        run: composer validate --no-check-publish --strict
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction
      - name: Lint PHP files
        run: |
          find modules crons tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=512M
      - name: PHPCS
        run: vendor/bin/phpcs
      - name: Registrar logo magic bytes
        run: bash scripts/check-logo-magic.sh
      - name: Release zip dry-run
        env:
          VERSION: v0.0.0-ci
        run: |
          bash scripts/build-release.sh
          test -f dist/whmcs-connectreseller-0.0.0-ci.zip
          test -f dist/whmcs-connectreseller-0.0.0-ci.zip.sha256
          grep -E '^[a-f0-9]{64}  whmcs-connectreseller-0.0.0-ci\.zip$' \
            dist/whmcs-connectreseller-0.0.0-ci.zip.sha256

  test:
    name: PHPUnit PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, mbstring
          coverage: none
          tools: composer:v2
      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-${{ matrix.php }}-
            ${{ runner.os }}-composer-
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction
      - name: PHPUnit
        run: vendor/bin/phpunit
