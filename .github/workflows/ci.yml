name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  static:
    name: Static (PHP 8.2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          # Exact patch. Fail closed if setup-php cannot install it.
          php-version: '8.2.35'
          extensions: curl, json, mbstring
          coverage: none
          tools: composer:v2
      - name: Assert patched PHP
        run: |
          php -r 'fwrite(STDERR, "PHP_VERSION=" . PHP_VERSION . PHP_EOL); exit(version_compare(PHP_VERSION, "8.2.35", ">=") ? 0 : 1);'
      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-8.2.35-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-8.2.35-
            ${{ runner.os }}-composer-
      - name: Validate composer.json
        run: composer validate --no-check-publish --strict
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction
      - name: Lint PHP files
        run: |
          find modules crons tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=512M
      - name: PHPCS
        run: vendor/bin/phpcs
      - name: Registrar logo magic bytes
        run: bash scripts/check-logo-magic.sh
      - name: Release zip dry-run
        env:
          VERSION: v0.0.0-ci
        run: |
          bash scripts/build-release.sh
          test -f dist/whmcs-connectreseller-0.0.0-ci.zip
          test -f dist/whmcs-connectreseller-0.0.0-ci.zip.sha256
          grep -E '^[a-f0-9]{64}  whmcs-connectreseller-0.0.0-ci\.zip$' \
            dist/whmcs-connectreseller-0.0.0-ci.zip.sha256

  test:
    name: PHPUnit PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '7.4'
            setup: '7.4'
            floor: ''
          - php: '8.1'
            setup: '8.1'
            floor: ''
          - php: '8.2'
            setup: '8.2.35'
            floor: '8.2.35'
          - php: '8.3'
            setup: '8.3.36'
            floor: '8.3.36'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          # 8.2/8.3 are exact patches. Do not fall back to floating 8.2 or 8.3.
          php-version: ${{ matrix.setup }}
          extensions: curl, json, mbstring
          coverage: none
          tools: composer:v2
      - name: Assert patched PHP
        if: ${{ matrix.floor != '' }}
        env:
          PHP_FLOOR: ${{ matrix.floor }}
        run: |
          php -r 'fwrite(STDERR, "PHP_VERSION=" . PHP_VERSION . " floor=" . getenv("PHP_FLOOR") . PHP_EOL); exit(version_compare(PHP_VERSION, getenv("PHP_FLOOR"), ">=") ? 0 : 1);'
      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ matrix.setup }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-${{ matrix.setup }}-
            ${{ runner.os }}-composer-
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction
      - name: PHPUnit
        run: vendor/bin/phpunit
